services:
  # NOTE: Postgres is hosted on Supabase (external). No local postgres service.

  redis:
    image: redis:7-alpine
    container_name: auditcore_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - auditcore_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditcore_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL is assembled from Supabase parts in app/config.py
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Anon key for the rate-limited /auth/login proxy (same value as the
      # frontend VITE_AUDITCORE_SUPABASE_ANON_KEY).
      SUPABASE_ANON_KEY: ${VITE_AUDITCORE_SUPABASE_ANON_KEY}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      # Phase 2: encrypted file storage
      STORAGE_ROOT: /data
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      # Auth for the Baileys bridge (X-Bridge-Token).
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Persistent encrypted document storage (Smart Box), outside the container.
      - auditcore_data:/data
    depends_on:
      - redis
    networks:
      - auditcore_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditcore_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      # Worker dispatches WhatsApp via the bridge → needs the shared token.
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN}
    # Celery worker consuming OCR + task + analysis queues (Tesseract/poppler in image).
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q ocr,tasks,analysis,notify
    volumes:
      - ./backend:/app
      # Must share the same encrypted storage as the backend.
      - auditcore_data:/data
    depends_on:
      - redis
    networks:
      - auditcore_net

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auditcore_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
    # Celery Beat scheduler: daily task generation (08:00 Baghdad) + overdue checks.
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - auditcore_net

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: auditcore_frontend
    restart: unless-stopped
    environment:
      VITE_AUDITCORE_SUPABASE_URL: ${VITE_AUDITCORE_SUPABASE_URL}
      VITE_AUDITCORE_SUPABASE_ANON_KEY: ${VITE_AUDITCORE_SUPABASE_ANON_KEY}
      VITE_AUDITCORE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - auditcore_net

  baileys-bridge:
    build:
      context: ./baileys-bridge
      dockerfile: Dockerfile
    container_name: auditcore_baileys
    restart: unless-stopped
    environment:
      PORT: "3001"
      WHATSAPP_AUTH_DIR: /data/whatsapp_auth
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN}
    volumes:
      # Persist the WhatsApp session across restarts (shared /data volume).
      - auditcore_data:/data
    expose:
      - "3001"
    networks:
      - auditcore_net

volumes:
  redis_data:
  auditcore_data:

networks:
  auditcore_net:
    driver: bridge
